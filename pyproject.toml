[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exoplanet-cnn"
version = "0.1.0"
description = "AstroNet reproduced and extended with ExoMiner-style diagnostic views: a 1D CNN that vets Kepler transit signals"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Christian Jair (Kister Space)"}]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "astropy>=5.3", "scikit-learn>=1.3",
                "torch>=2.2", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
exocnn = "exocnn.cli:main"

[tool.setuptools.packages.find]
include = ["exocnn*"]
